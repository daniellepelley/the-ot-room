name: Promote Site (test -> live)

# Manual promotion: copies exactly what's live on test.theotroom.co.uk to the production bucket
# (theotroom.co.uk) with an S3 server-side copy, then invalidates the production CloudFront
# distribution. No rebuild — it ships the exact bytes you reviewed on test, so what you tested is
# what goes live.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "promote" to confirm copying test -> live.'
        required: true
        default: ''

jobs:
  promote:
    if: ${{ inputs.confirm == 'promote' }}
    # The production environment carries the approval gate: give it required reviewers in the repo
    # settings and this job pauses for a manual approval before it copies anything to live.
    environment: production
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ vars.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ vars.WEBSITE_AWS_REGION }}

    steps:
    - name: Copy test bucket -> live bucket
      run: |
        aws s3 sync "s3://${{ vars.WEBSITE_TEST_BUCKET }}" "s3://${{ vars.WEBSITE_LIVE_BUCKET }}" --delete

    - name: Invalidate the production CloudFront distribution
      run: |
        aws cloudfront create-invalidation \
          --distribution-id "${{ vars.WEBSITE_LIVE_DISTRIBUTION_ID }}" \
          --paths "/*"

    - name: Summary
      run: echo "Promoted test -> https://www.theotroom.co.uk" >> "$GITHUB_STEP_SUMMARY"
